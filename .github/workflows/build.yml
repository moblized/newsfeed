name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "NewsFeed-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NewsFeed-${{ env.VERSION_NAME }}
          path: NewsFeed-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: NewsFeed ${{ env.VERSION_NAME }}
          files: NewsFeed-${{ env.VERSION_NAME }}.apk
          make_latest: true
          body: |
            Download **NewsFeed-${{ env.VERSION_NAME }}.apk** below and open it on your phone to install or update.
